# Alembic config. The database URL comes from DATABASE_URL (see db/migrations/env.py),
# never from this file.
[alembic]
script_location = %(here)s/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s


# Logging is configured in db/migrations/env.py (JSON lines, like the services).
