[project]
name = "artec-campaign-agents"
version = "0.1.0"
description = "Multi-agent marketing system: campaign brief to human-approved social posts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "claude-agent-sdk>=0.2.168",
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Not an installable package: services run from the repo root (python -m worker, uvicorn app.main:app).
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs a Postgres reachable at TEST_DATABASE_URL",
    "live: makes a real paid API call; run only on purpose",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake keys and passwords in fixtures

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
